<div id="share-buttons">
    <a href="https://x.com/intent/post?url={{ page.url | absolute_url | url_encode }}&text={{ page.title | url_encode }}"
        class="share-btn share-x" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-x-twitter"></i> Post
    </a>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}"
        class="share-btn share-linkedin" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-linkedin"></i> Share
    </a>
    <button class="share-btn share-copy">
        <i class="fas fa-link"></i> Copy Link
    </button>
</div>
