<!-- 5-theme selector — matches portfolio (dark / light / batman / cyberpunk / ocean) -->
<div class="theme-wrap" id="theme-wrap">
    <button class="theme-icon-btn" id="theme-btn" aria-label="Change theme" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/>
        </svg>
        <span class="theme-label">Dark</span>
    </button>
    <div class="theme-popover" id="theme-popover" role="menu">
        <button class="theme-opt active" data-theme="dark" role="menuitem">
            <span class="theme-swatch" style="background:#00ccff"></span> Dark
        </button>
        <button class="theme-opt" data-theme="light" role="menuitem">
            <span class="theme-swatch" style="background:#0055cc"></span> Light
        </button>
        <button class="theme-opt" data-theme="batman" role="menuitem">
            <span class="theme-swatch" style="background:#FFE919"></span> Batman
        </button>
        <button class="theme-opt" data-theme="cyberpunk" role="menuitem">
            <span class="theme-swatch" style="background:#ff0080"></span> Cyberpunk
        </button>
        <button class="theme-opt" data-theme="ocean" role="menuitem">
            <span class="theme-swatch" style="background:#00e5b0"></span> Ocean
        </button>
    </div>
</div>
